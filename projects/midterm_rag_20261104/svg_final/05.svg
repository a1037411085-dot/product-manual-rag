<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FAFAF8"/><g id="content" data-pptx-bounds="0 0 1280 720"><text x="82" y="87" font-size="40" fill="#162B3B" font-weight="bold">一次实际问答</text><text x="82" y="137" font-size="24" fill="#4B6C7A" font-weight="normal">v3 报告记录的在线模式样本</text><rect x="82" y="162" width="1116" height="1" fill="#D8E0E2"/><text x="82" y="226" font-size="24" fill="#2F6675" font-weight="bold">用户问</text><text x="250" y="226" font-size="32" fill="#162B3B" font-weight="bold">空调的建议制冷面积是多少？</text><rect x="82" y="266" width="1116" height="1" fill="#D8E0E2"/><text x="82" y="321" font-size="24" fill="#2F6675" font-weight="bold">系统答</text><text x="250" y="321" font-size="30" fill="#162B3B" font-weight="normal">32–48 m²，来自资料 [1]。</text><text x="250" y="373" font-size="30" fill="#162B3B" font-weight="normal">资料 [3] 给出 23–34 m²，系统提示人工确认。</text><rect x="82" y="438" width="1116" height="1" fill="#D8E0E2"/><text x="82" y="493" font-size="24" fill="#2F6675" font-weight="bold">怎么处理</text><text x="250" y="493" font-size="26" fill="#162B3B" font-weight="normal">给出参考值，同时把来源冲突告诉用户。</text><text x="250" y="537" font-size="26" fill="#162B3B" font-weight="normal">常规问答可走 FAQ、原文回答或模型生成。</text><text x="82" y="622" font-size="18" fill="#4B6C7A" font-weight="normal">来源：v3 评估报告 §6.2。系统回答摘述。</text><rect x="82" y="652" width="1116" height="1" fill="#D8E0E2"/><text x="1157" y="684" font-size="18" fill="#4B6C7A" font-weight="normal">05</text></g></svg>