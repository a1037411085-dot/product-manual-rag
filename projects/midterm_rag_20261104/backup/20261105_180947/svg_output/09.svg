<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FAFAF8"/><g id="content" data-pptx-bounds="0 0 1280 720"><text x="82" y="87" font-size="40" fill="#162B3B" font-weight="bold">答错的 6 kg 是怎么来的</text><text x="82" y="137" font-size="24" fill="#4B6C7A" font-weight="normal">同一份说明书里，有多个不同含义的容量</text><rect x="82" y="162" width="1116" height="1" fill="#D8E0E2"/><text x="82" y="227" font-size="24" fill="#2F6675" font-weight="bold">问题</text><text x="250" y="227" font-size="32" fill="#162B3B" font-weight="bold">洗衣机额定洗涤容量是多少？</text><rect x="82" y="270" width="1116" height="1" fill="#D8E0E2"/><text x="82" y="330" font-size="24" fill="#2F6675" font-weight="bold">系统回答</text><text x="250" y="330" font-size="40" fill="#162B3B" font-weight="bold">6 kg</text><text x="421" y="330" font-size="27" fill="#4B6C7A" font-weight="normal">对应“智能清洗”程序</text><text x="82" y="423" font-size="24" fill="#2F6675" font-weight="bold">说明书答案</text><text x="250" y="423" font-size="40" fill="#162B3B" font-weight="bold">9 kg</text><text x="421" y="423" font-size="27" fill="#4B6C7A" font-weight="normal">对应整机额定洗涤容量</text><text x="82" y="515" font-size="25" fill="#162B3B" font-weight="normal">表格拍平后，参数名脱离了原来的行和适用条件。</text><text x="82" y="560" font-size="25" fill="#162B3B" font-weight="normal">另一个问题：问“冰箱卖多少钱”，系统返回了食物冷却说明。</text><text x="82" y="622" font-size="18" fill="#4B6C7A" font-weight="normal">来源：v3 评估报告 §6.2、表 3。</text><rect x="82" y="652" width="1116" height="1" fill="#D8E0E2"/><text x="82" y="684" font-size="18" fill="#4B6C7A" font-weight="normal">02  已经做了什么</text><text x="1157" y="684" font-size="18" fill="#4B6C7A" font-weight="normal">09</text></g></svg>