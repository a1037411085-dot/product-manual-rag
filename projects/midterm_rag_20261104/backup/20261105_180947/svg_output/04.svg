<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FAFAF8"/><g id="content" data-pptx-bounds="0 0 1280 720"><text x="82" y="87" font-size="40" fill="#162B3B" font-weight="bold">说明书怎么进入知识库</text><text x="82" y="137" font-size="24" fill="#4B6C7A" font-weight="normal">切片决定了检索时能看到多少上下文</text><rect x="82" y="162" width="1116" height="1" fill="#D8E0E2"/><rect x="82" y="204" width="1116" height="1" fill="#D8E0E2"/><text x="82" y="246" font-size="28" fill="#2F6675" font-weight="bold">清洗</text><text x="280" y="246" font-size="28" fill="#162B3B" font-weight="normal">规范化文本，去除页码和相邻重复行</text><text x="280" y="284" font-size="24" fill="#4B6C7A" font-weight="normal">标题保留下来，长文本按规则切片。</text><rect x="82" y="343" width="1116" height="1" fill="#D8E0E2"/><text x="82" y="385" font-size="28" fill="#2F6675" font-weight="bold">检索</text><text x="280" y="385" font-size="28" fill="#162B3B" font-weight="normal">离线用字符 n-gram 哈希与覆盖评分</text><text x="280" y="423" font-size="24" fill="#4B6C7A" font-weight="normal">语义路径用多语言 Embedding 和 FAISS。</text><rect x="82" y="482" width="1116" height="1" fill="#D8E0E2"/><text x="82" y="524" font-size="28" fill="#2F6675" font-weight="bold">限定范围</text><text x="280" y="524" font-size="28" fill="#162B3B" font-weight="normal">检索前先按产品和版本过滤</text><text x="280" y="562" font-size="24" fill="#4B6C7A" font-weight="normal">多型号表格被拍平时，字段和值仍可能失去对应关系。</text><rect x="82" y="652" width="1116" height="1" fill="#D8E0E2"/><text x="82" y="684" font-size="18" fill="#4B6C7A" font-weight="normal">02  已经做了什么</text><text x="1157" y="684" font-size="18" fill="#4B6C7A" font-weight="normal">04</text></g></svg>