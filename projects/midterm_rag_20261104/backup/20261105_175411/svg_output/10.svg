<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FAFAF8"/><g id="content" data-pptx-bounds="0 0 1280 720"><text x="82" y="87" font-size="40" fill="#162B3B" font-weight="bold">下一步先修这三个问题</text><text x="82" y="137" font-size="24" fill="#4B6C7A" font-weight="normal">每次只改一个关键环节，再用固定题集对照</text><rect x="82" y="162" width="1116" height="1" fill="#D8E0E2"/><rect x="82" y="204" width="1116" height="1" fill="#D8E0E2"/><text x="82" y="246" font-size="28" fill="#2F6675" font-weight="bold">01  表格</text><text x="280" y="246" font-size="28" fill="#162B3B" font-weight="normal">保留型号、参数、数值和适用条件</text><text x="280" y="284" font-size="24" fill="#4B6C7A" font-weight="normal">优先复测空调多型号规格表与洗衣机容量。</text><rect x="82" y="343" width="1116" height="1" fill="#D8E0E2"/><text x="82" y="385" font-size="28" fill="#2F6675" font-weight="bold">02  拒答</text><text x="280" y="385" font-size="28" fill="#162B3B" font-weight="normal">判断证据是否真的包含所问字段</text><text x="280" y="423" font-size="24" fill="#4B6C7A" font-weight="normal">加测价格、费用和说明书未覆盖的问法。</text><rect x="82" y="482" width="1116" height="1" fill="#D8E0E2"/><text x="82" y="524" font-size="28" fill="#2F6675" font-weight="bold">03  评估</text><text x="280" y="524" font-size="28" fill="#162B3B" font-weight="normal">固定回答方式，单独比较检索器</text><text x="280" y="562" font-size="24" fill="#4B6C7A" font-weight="normal">补同义改写题和无答案题，用独立开发集校准阈值。</text><rect x="82" y="652" width="1116" height="1" fill="#D8E0E2"/><text x="82" y="684" font-size="18" fill="#4B6C7A" font-weight="normal">产品说明书智能问答系统   /   期中汇报</text><text x="1157" y="684" font-size="18" fill="#4B6C7A" font-weight="normal">10</text></g></svg>