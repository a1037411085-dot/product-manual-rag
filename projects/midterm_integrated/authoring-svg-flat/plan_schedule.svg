<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei"><rect id="bg" x="0" y="0" width="1280" height="720" fill="#FAFAF8" /><text x="82" y="87" font-size="40" fill="#162B3B" font-weight="bold" id="new-1">三周路线图与目标</text><text x="82" y="137" font-size="24" fill="#4B6C7A" font-weight="normal" id="new-2">每一步都用可复现的测评结果检验</text><rect id="line1" x="82" y="162" width="1116" height="1" fill="#D8E0E2" /><text x="82" y="220" font-size="24" fill="#2F6675" font-weight="bold" id="new-4">第 1 周</text><text x="260" y="220" font-size="23" fill="#162B3B" font-weight="normal" id="new-5">重清洗语料，重建索引，使用原 158 题复测</text><text x="82" y="320" font-size="24" fill="#2F6675" font-weight="bold" id="new-6">第 2 周</text><text x="260" y="320" font-size="23" fill="#162B3B" font-weight="normal" id="new-7">扩充至 300 题，补充和复测 30 条失败案例</text><text x="82" y="420" font-size="24" fill="#2F6675" font-weight="bold" id="new-8">第 3 周</text><text x="260" y="420" font-size="23" fill="#162B3B" font-weight="normal" id="new-9">更新评估数据、报告与答辩材料</text><text x="82" y="520" font-size="24" fill="#2F6675" font-weight="bold" id="new-10">目标</text><text x="260" y="520" font-size="23" fill="#162B3B" font-weight="normal" id="new-11">空调 Hit@1 由 56.6% 提升至 80% 以上</text><text x="260" y="559" font-size="23" fill="#162B3B" font-weight="normal" id="new-12">语义检索 Hit@1 目标不低于 79%，拒答效果持续复测</text><text x="82" y="634" font-size="17" fill="#4B6C7A" font-weight="normal" id="new-13">以上为原计划的预期目标，并非已完成结果。</text></svg>