<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei"><rect id="bg" x="0" y="0" width="1280" height="720" fill="#FAFAF8" /><text x="82" y="87" font-size="40" fill="#162B3B" font-weight="bold" id="new-1">下一步：先修语料，再补测评</text><text x="82" y="137" font-size="24" fill="#4B6C7A" font-weight="normal" id="new-2">围绕现有错答，逐项完成修复与复测</text><rect id="line1" x="82" y="162" width="1116" height="1" fill="#D8E0E2" /><text x="82" y="220" font-size="24" fill="#2F6675" font-weight="bold" id="new-4">语料库</text><text x="260" y="220" font-size="23" fill="#162B3B" font-weight="normal" id="new-5">保留表格行主语、型号和适用条件，避免参数错配</text><text x="260" y="259" font-size="23" fill="#162B3B" font-weight="normal" id="new-6">改为段落级切片，扩充说明书并按型号拆分版本</text><text x="82" y="345" font-size="24" fill="#2F6675" font-weight="bold" id="new-7">测评集</text><text x="260" y="345" font-size="23" fill="#162B3B" font-weight="normal" id="new-8">从 158 题扩充至 300 题，补充同义改写与多轮追问</text><text x="260" y="384" font-size="23" fill="#162B3B" font-weight="normal" id="new-9">均衡产品题量，过滤畸形问句，使用配对检验</text><text x="82" y="470" font-size="24" fill="#2F6675" font-weight="bold" id="new-10">失败分析</text><text x="260" y="470" font-size="23" fill="#162B3B" font-weight="normal" id="new-11">统一记录现象、证据、根因、修复和复测结果</text><text x="260" y="509" font-size="23" fill="#162B3B" font-weight="normal" id="new-12">案例从 12 条扩至 30 条，已修问题用同批样本复跑</text><text x="82" y="634" font-size="17" fill="#4B6C7A" font-weight="normal" id="new-13">计划和目标来自《下一步计划》，实施效果以复测为准。</text></svg>